apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aisdlc-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/thomashenselqvest/sldcbackendtest.git
    targetRevision: main
    path: manifests/aisdlc-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: aisdlc-agents
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
