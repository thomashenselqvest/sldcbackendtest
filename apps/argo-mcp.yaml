apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-mcp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-mcp
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  sources:
    - repoURL: ghcr.io/containers/charts
      chart: kubernetes-mcp-server
      targetRevision: 0.1.0
      helm:
        releaseName: argo-mcp
        valueFiles: [$values/values/argo-mcp.yaml]
    - repoURL: https://github.com/thomashenselqvest/sldcbackendtest.git
      targetRevision: main
      path: manifests/argo-mcp
    - repoURL: https://github.com/thomashenselqvest/sldcbackendtest.git
      targetRevision: main
      ref: values
