apiVersion: v1
kind: ServiceAccount
metadata:
  name: turnstone-config
  namespace: turnstone
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: turnstone-config
  namespace: turnstone
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [turnstone-agent-token]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [turnstone-server]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: turnstone-config
  namespace: turnstone
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: turnstone-config}
subjects: [{kind: ServiceAccount, name: turnstone-config, namespace: turnstone}]
