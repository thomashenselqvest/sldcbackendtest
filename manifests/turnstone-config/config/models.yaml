# Model definitions, upserted by alias. api_key_env names an env var in the sync Job.
- alias: opus
  model: claude-opus-5-5
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
- alias: fable
  model: claude-fable-5-1
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
- alias: sonnet
  model: claude-sonnet-5-5
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
- alias: haiku
  model: claude-haiku-5-5
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
  context_window: 1000000
  # Turnstone 1.8.5 has no profile for Haiku 5.5; its fallback sends budget_tokens,
  # which this model rejects. Match the 5.5 family instead.
  capabilities:
    context_window: 1000000
    max_output_tokens: 128000
    thinking_mode: adaptive
    supports_effort: true
    effort_levels: [low, medium, high, xhigh, max]
    supports_temperature: false
    supports_tool_search: true
    thinking_display: summarized
