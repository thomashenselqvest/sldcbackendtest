# MCP servers, upserted by name. ${VAR} in headers is substituted from the Job env.
- name: argo
  transport: streamable-http
  url: http://argo-mcp-kubernetes-mcp-server.argo-mcp.svc:8080/mcp
  headers:
    Authorization: Bearer ${MCP_TOKEN}
# Knowledge base (Qdrant "knowledge" collection). Read-only for normal agents.
- name: rag
  transport: streamable-http
  url: http://rag-mcp.rag.svc:8000/mcp/   # trailing slash: the server 307-redirects /mcp
# Read-write (adds qdrant-store). Give it only to curator/ingestion personas.
- name: rag-writer
  transport: streamable-http
  url: http://rag-writer-mcp.rag.svc:8000/mcp/
# Argo-specific tools (logs, retry, terminate, cron, templates) via Heapy/argo-workflows-mcp.
# Read-only until mutations are enabled in its UI (localhost:8883/settings).
- name: argo-workflows
  transport: streamable-http
  url: http://argo-workflows-mcp.argo-mcp.svc:8000/mcp
