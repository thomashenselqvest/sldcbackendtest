# The chart can't pin nodePort numbers; these give fixed ports that kind maps to localhost.
apiVersion: v1
kind: Service
metadata:
  name: turnstone-server-np
  namespace: turnstone
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: turnstone, app.kubernetes.io/instance: turnstone, app.kubernetes.io/component: server}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: 30080}]
---
apiVersion: v1
kind: Service
metadata:
  name: turnstone-console-np
  namespace: turnstone
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: turnstone, app.kubernetes.io/instance: turnstone, app.kubernetes.io/component: console}
  ports: [{name: http, port: 8090, targetPort: http, nodePort: 30090}]
