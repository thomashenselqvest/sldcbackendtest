# Identity Turnstone uses for the argo MCP server. Turnstone sends this account's token as
# "Authorization: Bearer ..."; the MCP server forwards it to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: turnstone-mcp
  namespace: turnstone
---
apiVersion: v1
kind: Secret
metadata:
  name: turnstone-mcp-token
  namespace: turnstone
  annotations:
    kubernetes.io/service-account.name: turnstone-mcp
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: turnstone-mcp-cluster-admin
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects: [{kind: ServiceAccount, name: turnstone-mcp, namespace: turnstone}]
