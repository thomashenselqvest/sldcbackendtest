# Reads secrets from Infisical project "sdlc-platform", environment "dev", path "/".
# Credentials: the read-only "external-secrets" machine identity created by infisical-config.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc:8080
      auth:
        universalAuthCredentials:
          clientId: {name: infisical-universal-auth, key: clientId, namespace: external-secrets}
          clientSecret: {name: infisical-universal-auth, key: clientSecret, namespace: external-secrets}
      secretsScope:
        projectSlug: sdlc-platform
        environmentSlug: dev
        secretsPath: /
