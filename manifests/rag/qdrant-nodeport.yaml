# Qdrant REST API + web dashboard (http://localhost:6333/dashboard). The chart can't pin a nodePort.
apiVersion: v1
kind: Service
metadata:
  name: qdrant-np
  namespace: rag
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: qdrant, app.kubernetes.io/instance: qdrant}
  ports: [{name: http, port: 6333, targetPort: 6333, nodePort: 30633}]
