# Qdrant MCP server (read-only: qdrant-find only). Embeds with FastEmbed in-process; the model downloads on first use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-mcp
  namespace: rag
  labels: {app: rag-mcp}
spec:
  replicas: 1
  selector: {matchLabels: {app: rag-mcp}}
  template:
    metadata:
      labels: {app: rag-mcp}
    spec:
      containers:
        - name: mcp
          image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
          command: [uvx, --from, "mcp-server-qdrant==0.8.1", mcp-server-qdrant, --transport, streamable-http]
          env:
            - {name: QDRANT_URL, value: "http://qdrant.rag.svc:6333"}
            - {name: COLLECTION_NAME, value: knowledge}
            - {name: EMBEDDING_MODEL, value: sentence-transformers/all-MiniLM-L6-v2}
            - {name: QDRANT_READ_ONLY, value: "true"}
            - {name: FASTMCP_SERVER_HOST, value: "0.0.0.0"}
            - {name: FASTMCP_SERVER_PORT, value: "8000"}
            - {name: FASTMCP_HOST, value: "0.0.0.0"}
            - {name: FASTMCP_PORT, value: "8000"}
            - {name: UV_CACHE_DIR, value: /cache/uv}
            - {name: HF_HOME, value: /cache/hf}
            - {name: FASTEMBED_CACHE_PATH, value: /cache/fastembed}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 1Gi}
          volumeMounts: [{name: cache, mountPath: /cache}]
      volumes: [{name: cache, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: rag-mcp
  namespace: rag
spec:
  selector: {app: rag-mcp}
  ports: [{name: http, port: 8000, targetPort: http}]
