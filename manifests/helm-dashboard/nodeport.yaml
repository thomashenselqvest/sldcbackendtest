# Helm Dashboard UI on localhost:8882 (kind port mapping). It has no login and cluster-wide
# write access: keep it local.
apiVersion: v1
kind: Service
metadata:
  name: helm-dashboard-np
  namespace: helm-dashboard
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: helm-dashboard, app.kubernetes.io/instance: helm-dashboard}
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30882}]
