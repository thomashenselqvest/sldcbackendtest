# POST {"message": "..."} to http://webhook-eventsource-svc.argo:12000/example
# and the Sensor submits a workflow that echoes the message.
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: webhook
  namespace: argo
spec:
  service:
    ports: [{port: 12000, targetPort: 12000}]
  webhook:
    example: {port: "12000", endpoint: /example, method: POST}
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook
  namespace: argo
spec:
  template:
    serviceAccountName: argo-events-sensor
  dependencies:
    - {name: payload, eventSourceName: webhook, eventName: example}
  triggers:
    - template:
        name: run-workflow
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata: {generateName: webhook-}
              spec:
                entrypoint: main
                serviceAccountName: argo-workflow
                arguments: {parameters: [{name: message, value: placeholder}]}
                templates:
                  - name: main
                    inputs: {parameters: [{name: message}]}
                    container:
                      image: busybox
                      command: [echo, "{{inputs.parameters.message}}"]
          parameters:
            - src: {dependencyName: payload, dataKey: body.message}
              dest: spec.arguments.parameters.0.value
