# Heapy/argo-workflows-mcp: Argo-specific MCP tools (logs, retry, terminate, cron, templates)
# with its own web UI (/connections, /settings, /audit). It only speaks SSE, which Turnstone
# doesn't support, so a supergateway sidecar serves it as streamable HTTP on :8000/mcp.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argo-workflows-mcp-data
  namespace: argo-mcp
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 100Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-workflows-mcp
  namespace: argo-mcp
  labels: {app: argo-workflows-mcp}
spec:
  replicas: 1
  strategy: {type: Recreate}   # SQLite on a RWO volume
  selector: {matchLabels: {app: argo-workflows-mcp}}
  template:
    metadata:
      labels: {app: argo-workflows-mcp}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: server
          image: ghcr.io/heapy/argo-workflows-mcp:0fd559ed25a16fad418a3328d957cf5bebb7df8c
          env:
            - {name: ARGO_MCP_HOST, value: "0.0.0.0"}
            - {name: ARGO_MCP_PORT, value: "8080"}
            - {name: ARGO_MCP_DB_PATH, value: /app/data/argo-workflows-mcp.db}
          ports: [{name: ui, containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: ui}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts: [{name: data, mountPath: /app/data}]
        - name: gateway
          image: node:24-alpine
          command: [npx, -y, "supergateway@4.1.0", --sse, "http://localhost:8080/",
                    --outputTransport, streamableHttp, --port, "8000", --healthEndpoint, /healthz]
          env:
            - {name: npm_config_cache, value: /tmp/npm}
          ports: [{name: mcp, containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: mcp}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: argo-workflows-mcp-data}
---
apiVersion: v1
kind: Service
metadata:
  name: argo-workflows-mcp
  namespace: argo-mcp
spec:
  selector: {app: argo-workflows-mcp}
  ports:
    - {name: mcp, port: 8000, targetPort: mcp}
    - {name: ui, port: 8080, targetPort: ui}
---
# Web UI on localhost:8883 (kind port mapping). No login: keep it local.
apiVersion: v1
kind: Service
metadata:
  name: argo-workflows-mcp-ui
  namespace: argo-mcp
spec:
  type: NodePort
  selector: {app: argo-workflows-mcp}
  ports: [{name: ui, port: 8080, targetPort: ui, nodePort: 30883}]
