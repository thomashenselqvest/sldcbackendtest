# Agent name; defaults to the Helm release name (the agents/<folder> name).
name: ""

webhook:
  # The receiver listens on http://<name>-eventsource-svc.aisdlc-agents:<port><endpoint>
  endpoint: ""          # default: /<name>
  port: 12000

persona:
  displayName: ""
  description: ""
  # Required: the persona's base prompt.
  basePrompt: ""
  mcpEnabled: true
  memoryEnabled: false

workstream:
  model: opus
  autoApprove: true
  # Prepended to the webhook payload in the first message.
  instructions: "Handle this webhook event:"
  timeoutSeconds: 900

turnstone:
  image: ghcr.io/turnstonelabs/turnstone:1.8.5
  namespace: turnstone
  consoleUrl: http://turnstone-console.turnstone.svc:8090
  # Secret in aisdlc-agents holding the non-admin aisdlc-runner token (key: token).
  runnerTokenSecret: turnstone-runner-token
  # Names of the Turnstone release's ConfigMap/Secrets the ephemeral node reuses.
  configMap: turnstone-config
  dbSecret: turnstone-db
  authSecret: turnstone-auth
  dbUrl: postgresql+psycopg://turnstone:$(POSTGRES_PASSWORD)@turnstone-postgresql:5432/turnstone
